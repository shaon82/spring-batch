spring.application.name=spring-batch
server.port=8081

# ---------------------------------------------------------------------------
# Database (MySQL)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/spring_batch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# One connection per worker thread + job-repository bookkeeping
spring.datasource.hikari.maximum-pool-size=20

# ---------------------------------------------------------------------------
# JPA / Hibernate (never log SQL during a multi-million row run)
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

# ---------------------------------------------------------------------------
# Spring Batch
# ---------------------------------------------------------------------------
spring.batch.jdbc.initialize-schema=always
# Jobs are started by the scheduler, not at application startup
spring.batch.job.enabled=false

# ---------------------------------------------------------------------------
# Loan migration job: source (loan_acc_info_stage) -> destination (loan_acc_info)
# ---------------------------------------------------------------------------
# Rows per transaction
batch.loan-migration.chunk-size=1000
# Id-range partitions and the threads that process them in parallel
batch.loan-migration.partitions=8
batch.loan-migration.threads=8
# Attempts for a chunk hitting a transient DB error (deadlock, lock timeout)
batch.loan-migration.retry-limit=3
# Manual trigger endpoint: POST /api/batch/loan-migration/trigger
# It can TRUNCATE the destination table, so turn it off (or secure it) outside development.
batch.loan-migration.api.enabled=true
# Daily at 03:00 (second minute hour day-of-month month day-of-week)
batch.loan-migration.schedule.enabled=true
batch.loan-migration.schedule.cron=0 0 3 * * *
batch.loan-migration.schedule.zone=Asia/Dhaka
